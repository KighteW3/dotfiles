# Cyberpunk HUD palette
$void = rgb(000000)
$panel = rgba(000000e0)
$cyan = rgb(55ead4)
$magenta = rgb(c5003c)
$burgundy = rgb(880425)
$yellow = rgb(f3e600)
$white = rgb(ffffff)
$urgent = rgb(ff5555)
$font = 0xProto Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# An empty monitor selector draws every widget on each active monitor.
background {
    monitor =
    path = screenshot
    color = $void
    blur_passes = 4
    blur_size = 8
    brightness = 0.35
    vibrancy = 0.10
}

shape {
    monitor =
    size = 560, 440
    color = $panel
    rounding = 0
    border_size = 2
    border_color = $cyan
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(55ead459)
    shadow_boost = 1.0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = SESSION LOCKED
    color = $white
    font_size = 20
    font_family = $font
    position = 0, 155
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = $cyan
    font_size = 72
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $white
    font_size = 16
    font_family = $font
    position = 0, 15
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 420, 58
    outline_thickness = 2
    inner_color = $void
    outer_color = $cyan
    check_color = $yellow
    capslock_color = $magenta
    fail_color = $urgent
    font_color = $white
    font_family = $font
    fade_on_empty = false
    rounding = 0
    placeholder_text = <span foreground="##ffffff">ENTER PASSWORD</span>
    check_text = <span foreground="##f3e600">AUTHENTICATING...</span>
    fail_text = <span foreground="##ff5555">ACCESS DENIED: $FAIL</span>
    dots_size = 0.22
    dots_spacing = 0.28
    dots_rounding = 0
    position = 0, -75
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = KEYBOARD // $LAYOUT
    color = $yellow
    font_size = 14
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -145
    halign = center
    valign = center
    zindex = 1
}
